# mode_custom_prompt ≥ 6
- id: de-custom-baeckerei
  category: mode_custom_prompt
  session: { lang: de, mode: custom, level: A2, corrections: [inline], custom_prompt: "Du bist Verkäufer in einer Bäckerei in Wien. Ich kaufe Brötchen. Sprich einfach und freundlich." }
  history: [{ role: assistant, text: "Guten Morgen! Was darf es sein?" }]
  user: "Ich hätte gern vier Brötchen, bitte."
  expect: { returns_to_practice: true, one_question: true }
- id: de-custom-nachbar
  category: mode_custom_prompt
  session: { lang: de, mode: custom, level: A2, corrections: [after], custom_prompt: "Du bist mein neuer Nachbar. Wir treffen uns im Treppenhaus. Frag mich nach meinem Leben hier. Nach 10 Repliken nenne meine 3 Hauptfehler." }
  history: [{ role: assistant, text: "Hallo! Sie sind neu hier, oder?" }]
  user: "Ja, ich bin letzte Woche eingezogen."
  expect: { returns_to_practice: true, no_inline_correction: true }
- id: de-custom-arzt
  category: mode_custom_prompt
  session: { lang: de, mode: custom, level: B1, corrections: [inline], custom_prompt: "Rollenspiel: Du bist Arzthelferin in einer Praxis. Ich rufe an, um einen Termin zu vereinbaren." }
  history: [{ role: assistant, text: "Praxis Dr. Berg, guten Tag. Wie kann ich helfen?" }]
