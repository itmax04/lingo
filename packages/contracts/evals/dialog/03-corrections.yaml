# Eval `dialog`: режимы исправления R-20 и их сочетания, русская реплика без просьбы (R-18, A-2).
# correction_inline ≥ 8
- id: de-inline-an-ort
  category: correction_inline
  session: { lang: de, mode: questions, level: A2, topic: "Wohnort", corrections: [inline] }
  history: [{ role: assistant, text: "Was gefällt Ihnen an Hamburg?" }]
  user: "Mir gefällt in Hamburg, dass Hafen hier hast."
  expect: { contains_correction: ["an Hamburg", "es hier .*Hafen gibt", "dass es hier einen Hafen", "den Hafen"], asks_repeat: true, one_question: true }
- id: de-inline-seit
  category: correction_inline
  session: { lang: de, mode: questions, level: A2, topic: "Wohnort", corrections: [inline] }
  history: [{ role: assistant, text: "Wie lange wohnen Sie schon hier?" }]
  user: "Ich wohne hier seit zwei Jahre."
  expect: { contains_correction: ["zwei Jahren"], asks_repeat: true }
- id: de-inline-verb-end
  category: correction_inline
  session: { lang: de, mode: free, level: B1, corrections: [inline] }
  history: [{ role: assistant, text: "Warum lernen Sie Deutsch?" }]
  user: "Ich lerne Deutsch, weil ich will in Deutschland arbeiten."
  expect: { contains_correction: ["weil ich in Deutschland arbeiten will", "arbeiten möchte", "arbeiten will"], asks_repeat: true }
- id: de-inline-perfekt
  category: correction_inline
  session: { lang: de, mode: questions, level: A2, topic: "Wochenende", corrections: [inline, on_demand] }
  history: [{ role: assistant, text: "Was haben Sie am Wochenende gemacht?" }]
  user: "Am Wochenende ich habe gegangen ins Kino."
  expect: { contains_correction: ["bin ich ins Kino gegangen", "ins Kino gegangen"], asks_repeat: true }
- id: de-inline-wrong-question
  category: correction_inline
  session: { lang: de, mode: questions, level: A2, topic: "Kennenlernen", corrections: [inline] }
  history: [{ role: assistant, text: "Wie heißen Sie und woher kommen Sie?" }]
  user: "Ich heiße Alex."
  expect: { contains_correction: ["woher|komme aus|Ich komme"], one_question: true }
- id: en-inline-since
  category: correction_inline
  session: { lang: en, mode: questions, level: A2, topic: "Home", corrections: [inline] }
  history: [{ role: assistant, text: "How long have you lived in your flat?" }]
  user: "I live here since two years."
  expect: { contains_correction: ["have lived here for two years", "for two years", "lived here for"], asks_repeat: true }
- id: en-inline-third-person
  category: correction_inline
  session: { lang: en, mode: questions, level: A1, topic: "Family", corrections: [inline] }
  history: [{ role: assistant, text: "What does your brother do?" }]
  user: "My brother work in a bank."
  expect: { contains_correction: ["works in a bank", "brother works"], asks_repeat: true, max_words: 25 }
- id: en-inline-past
  category: correction_inline
  session: { lang: en, mode: free, level: B1, corrections: [inline, after] }
  history: [{ role: assistant, text: "What did you do yesterday evening?" }]
  user: "Yesterday I go to the cinema with my friend."
  expect: { contains_correction: ["went to the cinema", "I went"], asks_repeat: true }
- id: en-inline-no-mistake
  category: correction_inline
  session: { lang: en, mode: questions, level: B1, topic: "Hobbies", corrections: [inline] }
  history: [{ role: assistant, text: "What do you do in your free time?" }]
  user: "I usually play football with my colleagues on Fridays."
  expect: { no_inline_correction: true, one_question: true }
