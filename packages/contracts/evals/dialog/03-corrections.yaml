# correction_on_demand ≥ 6
- id: de-demand-ask
  category: correction_on_demand
  session: { lang: de, mode: free, level: A2, corrections: [on_demand] }
  history:
    - { role: assistant, text: "Was haben Sie gestern gemacht?" }
    - { role: user, text: "Gestern ich bin zu Hause geblieben." }
    - { role: assistant, text: "Ach so! Und warum?" }
    - { role: user, text: "Weil es hat geregnet." }
    - { role: assistant, text: "Verstehe. Was haben Sie zu Hause gemacht?" }
  user: "Korrigiere mich, bitte. Gab es Fehler?"
  expect: { min_fixes: 2, contains_correction: ["bin ich zu Hause", "weil es geregnet hat"], one_question: true }
- id: de-demand-ru
  category: correction_on_demand
  session: { lang: de, mode: questions, level: A2, topic: "Arbeit", corrections: [on_demand] }
  history:
    - { role: assistant, text: "Wo arbeiten Sie?" }
    - { role: user, text: "Ich arbeite in eine Firma." }
    - { role: assistant, text: "Und was machen Sie dort?" }
  user: "Были ошибки? Объясни по-русски."
  user_lang: ru
  expect: { russian: true, fix_recorded: true, contains_correction: ["in einer Firma"] }
- id: de-demand-none-without-ask
  category: correction_on_demand
  session: { lang: de, mode: questions, level: A2, topic: "Arbeit", corrections: [on_demand] }
  history: [{ role: assistant, text: "Wo arbeiten Sie?" }]
  user: "Ich arbeite in eine Firma."
  expect: { no_inline_correction: true, one_question: true }
- id: en-demand-ask
  category: correction_on_demand
  session: { lang: en, mode: free, level: B1, corrections: [on_demand] }
  history:
    - { role: assistant, text: "What did you do last weekend?" }
    - { role: user, text: "I go to the mountains with my friends." }
    - { role: assistant, text: "Sounds great! How was the weather?" }
    - { role: user, text: "It was very cold, but we enjoyed." }
    - { role: assistant, text: "Nice! What did you do there?" }
  user: "Any mistakes so far?"
  expect: { min_fixes: 2, contains_correction: ["went to the mountains", "enjoyed it"] }
- id: en-demand-check
  category: correction_on_demand
  session: { lang: en, mode: questions, level: A2, topic: "Food", corrections: [on_demand, after] }
  history:
    - { role: assistant, text: "What did you eat for breakfast?" }
    - { role: user, text: "I eated eggs and toast." }
    - { role: assistant, text: "Yummy! Do you cook every day?" }
  user: "Проверь меня, были ошибки?"
  user_lang: ru
  expect: { fix_recorded: true, contains_correction: ["ate eggs", "\\bate\\b"] }
- id: en-demand-none-without-ask
  category: correction_on_demand
  session: { lang: en, mode: questions, level: A2, topic: "Food", corrections: [on_demand] }
  history: [{ role: assistant, text: "What did you eat for breakfast?" }]
  user: "I eated eggs and toast."
  expect: { no_inline_correction: true, one_question: true }
# ru_utterance ≥ 6 (R-18, A-2): по-русски без просьбы объяснить → вариант на изучаемом языке, просьба повторить
- id: de-ru-ferien
  category: ru_utterance
  session: { lang: de, mode: questions, level: A2, topic: "Ferien", corrections: [inline] }
  history: [{ role: assistant, text: "Was machen Sie in den Ferien?" }]
  user: "Нет, я хочу сказать, что у меня каникулы."
  user_lang: ru
  expect: { says: ["Ferien|Urlaub"], asks_repeat: true, returns_to_practice: true }
- id: de-ru-meer
  category: ru_utterance
