# Eval `dialog`: the learner's own vocabulary (LINGO-08 PR-02, PR-03, PR-10). Synthetic data only (evals/README.md).
# vocab_weave >= 8 (a target woven naturally into an ordinary turn), vocab_focus >= 6 ("My words"), data_injection >= 2.
- id: en-weave-commute
  category: vocab_weave
  session: { lang: en, mode: free, level: B1, topic: "Daily routine", corrections: [after] }
  vocabulary: [{ text: "rush hour", translation: "час пик", status: new }, { text: "to commute", translation: "ездить на работу", status: new }, { text: "worn out", translation: "вымотанный", status: needs work }]
  history: [{ role: assistant, text: "What time do you usually start work?" }]
  user: "I start at eight, but I leave home at seven because the trains are very full."
  expect: { uses_target: true, one_question: true }
