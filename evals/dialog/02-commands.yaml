# continue ≥ 4
- id: de-continue
  category: continue
  session: { lang: de, mode: questions, level: A2, topic: "Wohnort", corrections: [inline] }
  history:
    - { role: assistant, text: "@say ru: «Seit wann» значит «с какого времени».\n@say de: Seit wann wohnen Sie in Hamburg?" }
  user: "Понятно. Давай продолжаем."
  user_lang: ru
  expect: { returns_to_practice: true, one_question: true }
- id: de-continue-weiter
  category: continue
  session: { lang: de, mode: free, level: B1, corrections: [after] }
  history: [{ role: assistant, text: "Gut gemacht! Möchten Sie eine Pause machen?" }]
  user: "Nein, machen wir weiter."
