# Eval `dialog`: команды R-14…R-19, R-22 (модель тоже знает команды из обёртки R-25).
# repeat ≥ 4
- id: de-repeat-nochmal
  category: repeat
  session: { lang: de, mode: questions, level: A2, topic: "Wohnort", corrections: [inline] }
  history: [{ role: assistant, text: "Wie lange wohnen Sie schon in Hamburg?" }]
  user: "Äh, nochmal bitte."
  expect: { repeats_previous: true }
- id: de-repeat-ru
  category: repeat
  session: { lang: de, mode: free, level: B1, corrections: [after] }
  history: [{ role: assistant, text: "Was haben Sie am Wochenende gemacht?" }]
  user: "Повтори, пожалуйста."
  user_lang: ru
  expect: { repeats_previous: true }
- id: en-repeat-again
  category: repeat
  session: { lang: en, mode: questions, level: A2, topic: "Travel", corrections: [inline] }
  history: [{ role: assistant, text: "Where did you go on your last holiday?" }]
  user: "Sorry, again please?"
  expect: { repeats_previous: true }
- id: en-repeat-ru
  category: repeat
  session: { lang: en, mode: free, level: B1, corrections: [on_demand] }
  history: [{ role: assistant, text: "What do you usually do after work?" }]
  user: "Ещё раз."
  user_lang: ru
  expect: { repeats_previous: true }
