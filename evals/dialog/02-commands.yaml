  session: { lang: de, mode: free, level: B1, corrections: [after] }
  history: [{ role: assistant, text: "Ich hätte gern gewusst, ob Sie schon mal in Wien waren." }]
  user: "Объясни по-русски, пожалуйста."
  user_lang: ru
  expect: { russian: true, returns_to_practice: true }
