name: ts
# TypeScript workspaces (web, engine, core-ts): tests and build (the workspace exists since LINGO-03 P-07a).
on:
  pull_request:
    paths:
      - "package.json"
      - "package-lock.json"
      - "tsconfig*.json"
      - "apps/web/**"
      - "services/**"
      - "packages/**"
      - ".github/workflows/ci-ts.yml"
  push:
    branches: [main]
    paths:
      - "package.json"
      - "package-lock.json"
      - "tsconfig*.json"
      - "apps/web/**"
      - "services/**"
      - "packages/**"
      - ".github/workflows/ci-ts.yml"
  workflow_dispatch:
concurrency:
  group: ts-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install, test, build
        run: |
          npm ci
          npm test
          npm run build
      - name: Engine — migrations apply to a local D1
        working-directory: services/engine
        run: npx wrangler d1 migrations apply lingo --local
      - name: Engine — the Worker starts; static files and API carry the security headers
        run: npm run smoke -w services/engine
      - name: Scan the built client for secrets
        if: hashFiles('apps/web/dist/**') != ''
        run: |
          if grep -rEn 'gsk_[A-Za-z0-9]{20,}|sk-[A-Za-z0-9_-]{32,}|Bearer [A-Za-z0-9_-]{24,}' apps/web/dist; then
            echo "Possible secret in the client bundle"; exit 1
          fi
