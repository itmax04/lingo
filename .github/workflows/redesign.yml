name: LINGO-07 checks
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: redesign-${{ github.ref }}
  cancel-in-progress: true
jobs:
  repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: scripts/check-english.sh
      - run: scripts/secret-scan.sh
      - run: python3 scripts/check-design.py
  swift:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Select Swift 6.2 or newer
        run: |
          XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          swift --version
      - run: swift test
      - run: |
          mkdir -p /tmp/lingo-localization
          xcrun xcstringstool compile Resources/Localizable.xcstrings --output-directory /tmp/lingo-localization
